name: validation
on: [push, pull_request, workflow_dispatch]
jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run prepare:companion
      - run: npm test
      - run: npm run prepare:extension
      - run: npx playwright install chromium
      - run: npm run test:browser
      - run: npm run test:media-browser
      - run: npm run test:types-browser
      - run: npm run test:stability-browser
      - run: npm run test:permissions-browser
      - run: npm run test:websites-browser
      - run: npm run test:examples-browser
      - run: npm run test:ui-browser
      - run: npm run test:collection-browser
      - run: npm run test:projects-browser
      - run: npm run test:theme-browser
      - run: node tests/package-smoke.mjs
      - run: node tests/companion-browser.mjs
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-artifacts
          path: |
            test-results/*report.json
