<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GUGA Knowledge · Store artwork</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: 'Segoe UI', sans-serif;
        color: #fffaf0;
        background: #245d4c;
      }
      main {
        width: 100%;
        height: 100%;
        position: relative;
        isolation: isolate;
        overflow: hidden;
        background: radial-gradient(ellipse at 100% 15%, #3e7670 0, transparent 61%), #245d4c;
      }
      .ring {
        position: absolute;
        border: 1px solid #ffffff14;
        border-radius: 50%;
        width: 760px;
        height: 760px;
        right: -160px;
        top: -370px;
        z-index: -1;
      }
      .ring.second {
        width: 1000px;
        height: 1000px;
        right: -245px;
        top: -490px;
      }
      .brand {
        position: absolute;
        left: 90px;
        top: 150px;
        z-index: 2;
      }
      .brand p {
        margin: 0 0 21px;
        font-size: 14px;
        letter-spacing: 4px;
        color: #e3d8be;
      }
      .brand h1 {
        font-size: 86px;
        line-height: 1.04;
        letter-spacing: -4px;
        margin: 0;
        font-weight: 610;
      }
      .brand .tagline {
        margin: 30px 0 0;
        font-size: 13px;
        letter-spacing: 3px;
        color: #d0dacd;
      }
      .mascot {
        position: absolute;
        width: 460px;
        height: 480px;
        object-fit: contain;
        right: 85px;
        top: 40px;
        z-index: 2;
      }
      .floor {
        position: absolute;
        right: 155px;
        bottom: 27px;
        width: 310px;
        height: 32px;
        border-radius: 100%;
        background: #163d3624;
        filter: blur(9px);
      }
      .note-card {
        position: absolute;
        right: 440px;
        top: 139px;
        width: 155px;
        height: 195px;
        background: #f5f1e5;
        border: 1px solid #e4e8d51f;
        border-radius: 18px;
        transform: rotate(-12deg);
        box-shadow: 0 16px 35px #12382e12;
        color: #3e6868;
        padding: 24px;
        z-index: 0;
      }
      .note-card .tick {
        width: 36px;
        height: 36px;
        border: 2px solid #3e6868;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-size: 22px;
        font-weight: 600;
      }
      .note-card i {
        display: block;
        width: 100%;
        height: 4px;
        margin-top: 18px;
        border-radius: 3px;
        background: #b2c1af;
      }
      .note-card i:last-child {
        width: 65%;
      }
      .bookmark {
        position: absolute;
        right: 70px;
        top: 68px;
        color: #ddd1ae;
        opacity: 0.6;
        transform: rotate(15deg);
      }
      .constellation {
        position: absolute;
        left: 710px;
        bottom: 85px;
        opacity: 0.35;
      }
      body.small .brand {
        left: 30px;
        top: 94px;
      }
      body.small .brand h1 {
        font-size: 32px;
        letter-spacing: -1.5px;
        line-height: 1.07;
      }
      body.small .brand p,
      body.small .tagline {
        display: none;
      }
      body.small .mascot {
        width: 200px;
        height: 240px;
        right: 17px;
        top: 20px;
      }
      body.small .floor {
        right: 8px;
        bottom: 9px;
        width: 160px;
        height: 17px;
      }
      body.small .note-card {
        right: 122px;
        top: 72px;
        width: 77px;
        height: 103px;
        border-radius: 10px;
        padding: 12px;
      }
      body.small .note-card .tick {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        font-size: 15px;
      }
      body.small .note-card i {
        margin-top: 11px;
        height: 3px;
      }
      body.small .bookmark {
        right: 12px;
        top: 23px;
        width: 24px;
        height: 30px;
      }
      body.small .constellation {
        left: 32px;
        bottom: 25px;
        width: 102px;
        height: 31px;
        opacity: 0.7;
      }
      body.small .ring {
        width: 410px;
        height: 410px;
        right: -135px;
        top: -118px;
      }
      body.small .ring.second {
        width: 540px;
        height: 540px;
        top: -180px;
        right: -200px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ring"></div>
      <div class="ring second"></div>
      <div class="brand">
        <p>YOUR KNOWLEDGE, GUGUGAGA</p>
        <h1>GUGA<br />Knowledge</h1>
        <p class="tagline">A LITTLE SPACE FOR YOUR MIND</p>
      </div>
      <div class="note-card"><span class="tick">✓</span><i></i><i></i></div>
      <svg class="bookmark" width="49" height="65" viewBox="0 0 49 65" fill="none">
        <path
          d="M7 4h35v54L25 46 7 58V4Z"
          stroke="currentColor"
          stroke-width="3"
          stroke-linejoin="round"
        />
      </svg>
      <svg class="constellation" width="154" height="48" viewBox="0 0 154 48" fill="none">
        <path d="M18 25h49l21-13h48" stroke="#f0e5c9" stroke-width="2" />
        <rect x="2" y="9" width="32" height="32" rx="9" fill="#e9e6d5" />
        <path d="m11 25 5 5 11-13" stroke="#285f49" stroke-width="2.4" stroke-linecap="round" />
        <circle cx="79" cy="25" r="12" fill="#bccbb8" />
        <circle cx="138" cy="12" r="10" fill="#c1ab85" />
      </svg>
      <div class="floor"></div>
      <img class="mascot" src="illustrations/penguin.png" alt="GUGA Knowledge penguin" />
    </main>
    <script>
      const kind = new URLSearchParams(location.search).get('kind');
      if (kind === 'small') document.body.className = 'small';
    </script>
  </body>
</html>
