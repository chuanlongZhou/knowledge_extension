<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title data-i18n="允许麦克风 · GUGA Knowledge">允许麦克风 · GUGA Knowledge</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="theme.css" />
  </head>
  <body class="permission-page">
    <main class="permission-card">
      <img src="icons/penguin.png" alt="企鹅" data-i18n-alt="企鹅" />
      <h1 data-i18n="允许使用麦克风">允许使用麦克风</h1>
      <p
        data-i18n="点击下方按钮，再在浏览器的权限提示中选择“允许”。授权完成后会返回插件并开始录音。"
      >
        <span
          data-i18n="点击下方按钮，再在浏览器的权限提示中选择“允许”。授权完成后会返回插件并开始录音。"
          >点击下方按钮，再在浏览器的权限提示中选择“允许”。授权完成后会返回插件并开始录音。</span
        >
      </p>
      <p
        id="microphone-status"
        role="status"
        aria-live="polite"
        data-i18n="麦克风只会在你主动录音时使用。"
      >
        麦克风只会在你主动录音时使用。
      </p>
      <div class="row">
        <button id="allow-microphone" class="button primary">
          <span data-i18n="允许麦克风">允许麦克风</span></button
        ><button id="cancel-microphone" class="button" data-i18n="取消">取消</button>
      </div>
      <button id="microphone-settings" class="link-button" data-i18n="打开浏览器麦克风设置">
        打开浏览器麦克风设置
      </button>
    </main>
    <script type="module" src="page.js?entry=microphone"></script>
  </body>
</html>
